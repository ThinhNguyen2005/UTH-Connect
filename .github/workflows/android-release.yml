
name: Android release APK

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  pr-validation:
    name: PR validation
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Test Firebase configuration validation
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'

      - name: Static code analysis, unit tests, and debug build
        run: bash ./gradlew detekt spotlessCheck :app:testDebugUnitTest :app:assembleDebug

  release:
    name: Trusted release APK
    needs: pr-validation
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Validate workflow secrets and variables
        shell: bash
        run: |
          set -euo pipefail
          missing=()

          [ -z "${GOOGLE_SERVICES_JSON:-}" ] && missing+=("secrets.GOOGLE_SERVICES_JSON")
          [ -z "${EXPECTED_FIREBASE_PROJECT_ID:-}" ] && missing+=("vars.FIREBASE_PROJECT_ID")

          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing required workflow configuration: ${missing[*]}" >&2
            echo "Please configure GOOGLE_SERVICES_JSON (secret) and FIREBASE_PROJECT_ID (variable) in GitHub Settings -> Secrets and variables -> Actions." >&2
            exit 1
          fi
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          EXPECTED_FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}

      - name: Test Firebase configuration validation
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'

      - name: Inject Firebase configuration
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          EXPECTED_FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
        run: python3 .github/scripts/inject_google_services.py

      - name: Static code analysis and unit tests
        run: bash ./gradlew detekt spotlessCheck :app:testDebugUnitTest

      - name: Build release APK
        env:
          ORG_GRADLE_PROJECT_useMockData: 'false'
          ORG_GRADLE_PROJECT_useSupabase: 'true'
          ORG_GRADLE_PROJECT_supabaseUrl: ${{ secrets.SUPABASE_URL }}
          ORG_GRADLE_PROJECT_supabasePublishableKey: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          ORG_GRADLE_PROJECT_googleWebClientId: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
        run: bash ./gradlew :app:assembleRelease

      - name: Sign and verify release APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"

          keystore="$RUNNER_TEMP/uth-release.keystore"
          aligned_apk="$RUNNER_TEMP/uth-aligned.apk"
          signed_temp_apk="$RUNNER_TEMP/uth-signed.apk"

          trap 'rm -f "$keystore" "$aligned_apk" "$signed_temp_apk"' EXIT

          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore"

          build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"

          "$build_tools/zipalign" -f -p 4 app/build/outputs/apk/release/app-release-unsigned.apk "$aligned_apk"

          "$build_tools/apksigner" sign \
            --ks "$keystore" \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
            --key-pass env:ANDROID_KEY_PASSWORD \
            --out "$signed_temp_apk" \
            "$aligned_apk"

          "$build_tools/apksigner" verify --verbose "$signed_temp_apk"

          mv -f "$signed_temp_apk" app/build/outputs/apk/release/app-release-signed.apk

      - name: Upload release APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: uth-connect-release-apk
          path: app/build/outputs/apk/release/app-release-signed.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: success() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: UTH Connect v1.0.${{ github.run_number }}
          generate_release_notes: true
          files: app/build/outputs/apk/release/app-release-signed.apk
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
