[versions]
agp = "9.3.3"
coreKtx = "1.19.1"
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"
lifecycleRuntimeKtx = "2.11.0"
# MVVM: hai artifact này trước đó chỉ là constraint (c) đi theo BOM, không phải
# dependency thật trên classpath — khai báo tường minh vì code trực tiếp gọi
# viewModel() và collectAsStateWithLifecycle().
lifecycleViewmodelCompose = "2.11.0"
lifecycleRuntimeCompose = "2.11.0"
# Khớp bản coroutines đang resolve trong app (1.9.0) để không kéo bản thứ hai vào.
coroutinesTest = "1.9.0"
activityCompose = "1.13.0"
navigationCompose = "2.10.2"
materialIconsCore = "1.7.8"
kotlin = "2.2.10"
composeBom = "2026.02.01"
# DI chính thức của app (README mục 5.2). Bản 2.60.1 là bản mới nhất có hỗ trợ
# Hilt Gradle plugin cho AGP 9 — từ Dagger 2.59, AGP 9.0.0+ là yêu cầu bắt buộc
# (nhóm đang ở 9.3.3). KSP 2.3.12 là bản độc lập: từ KSP 2.3.0, KSP2 không còn là
# compiler plugin nên không dính chặt theo từng bản Kotlin; yêu cầu AGP >= 8.12.
# androidx.hilt 1.4.0 đòi compileSdk 37 + AGP 9.2.0 (đang có: 37.1 / 9.3.3).
hilt = "2.60.1"
ksp = "2.3.12"
androidxHilt = "1.4.0"
# Navigation type-safe (README mục 8 / Design.md mục 8.1): route là @Serializable
# object nên cần plugin serialization (khớp bản Kotlin — 2.2.10) + runtime JSON.
kotlinxSerialization = "1.9.0"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycleViewmodelCompose" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycleRuntimeCompose" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
# Material 3 trong BOM mới không kéo theo bộ icon nữa. `material-icons-core` đã đóng băng
# từ 1.7.x (không còn cập nhật), đủ cho số icon đang dùng trong khung app.
# Khi module thật được làm, thay icon bằng vector drawable của thiết kế.
androidx-compose-material-icons-core = { group = "androidx.compose.material", name = "material-icons-core", version.ref = "materialIconsCore" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutinesTest" }
# Hilt: runtime + symbol processor. Bản KSP dùng artifact `hilt-compiler`
# (không phải `hilt-android-compiler` của thời kapt) — theo dagger.dev/hilt/gradle-setup.
hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-compiler = { group = "com.google.dagger", name = "hilt-compiler", version.ref = "hilt" }
# `hiltViewModel()` từ androidx.hilt 1.4.0 sống ở artifact riêng này; bản trong
# `hilt-navigation-compose` đã đánh dấu deprecated (moved package). NavHost đã đặt
# `LocalViewModelStoreOwner` theo NavBackStackEntry nên không cần navigation-compose
# cho DI — ViewModel tự scope theo back stack entry.
androidx-hilt-lifecycle-viewmodel-compose = { group = "androidx.hilt", name = "hilt-lifecycle-viewmodel-compose", version.ref = "androidxHilt" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerialization" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
# AGP 9 bật sẵn Kotlin nên không còn `org.jetbrains.kotlin.android`. KSP và Hilt
# là hai plugin duy nhất phải khai thêm; compiler chọn KSP thay kapt vì kapt
# không tương thích built-in Kotlin của AGP 9.
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }

